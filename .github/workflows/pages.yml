name: Build & deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validar y construir el banco
        run: python3 scripts/build_bank.py
      - name: Tests del motor
        run: npm test
      - name: Verificar que el banco commiteado está al día
        run: |
          if ! git diff --exit-code -- site/data/bank.json; then
            echo "::error::site/data/bank.json desactualizado. Corré npm run build y commiteá el resultado."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
